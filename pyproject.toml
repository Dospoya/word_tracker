[project]
name = "word-tracker"
version = "0.1.0"
dependencies = [
    "longbutton-app",
    "longbutton-bot",
    "longbutton-contracts",
]

[tool.uv.workspace]
members = [
    "src/app",
    "src/bot",
    "src/contracts",
]

[tool.uv.sources]
longbutton-app = { workspace = true }
longbutton-bot = { workspace = true }
longbutton-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
